<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roosad Käärid 2027</title>
  <meta name="keywords" content="Fashion, Roosa, moekonkurss, Käärid, Eesti, Mood, Show, Disainer, Trend, Kool, Rocca al Mare, Fotograafia, Models, Modellid, Collections, Kollektsioonid, Noored">
  <meta name="description" content="Roosad Käärid 2027 coming soon. Koostöösoovide korral kirjuta meile.">
  <link rel="icon" href="veits pixeldatud.jpg">
  <link href="./Roosad käärid 2025_files/css" rel="stylesheet">
  <style>
    :root {
      --pink: #ea00ff;
      --black: #000000;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--black);
      color: var(--pink);
      font-family: "Open Sans", Arial, sans-serif;
      overflow-x: hidden;
    }

    .brand-logo {
      position: fixed;
      top: clamp(20px, 4vw, 44px);
      left: clamp(18px, 4vw, 46px);
      width: clamp(70px, 9vw, 120px);
      aspect-ratio: 1;
      background-image: url("roosade logo mustal taustal.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      overflow: hidden;
    }

    .brand-logo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--pink);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .page {
      display: grid;
      width: 100%;
      min-height: 100vh;
      padding: clamp(32px, 7vw, 72px);
      grid-template-rows: 1fr auto;
      align-items: center;
      overflow-x: hidden;
      text-align: center;
    }

    .coming-soon {
      margin: 0 auto;
      max-width: 1060px;
      font-family: "Raleway", sans-serif;
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: 0;
    }

    .coming-soon span {
      display: block;
    }

    .event-name {
      color: var(--pink);
      font-size: clamp(3.2rem, 6.8vw, 6.6rem);
      text-shadow: 0 0 18px rgba(234, 0, 255, 0.72);
    }

    .event-year {
      color: var(--pink);
      font-size: clamp(2.7rem, 5.5vw, 5.4rem);
      text-shadow: 0 0 16px rgba(234, 0, 255, 0.64);
    }

    .soon {
      margin-top: clamp(10px, 2vw, 20px);
      color: var(--white);
      font-family: "Open Sans", Arial, sans-serif;
      font-size: clamp(1rem, 2vw, 1.85rem);
      font-style: italic;
      font-weight: 700;
      text-shadow: none;
    }

    .contact {
      display: flex;
      width: min(100%, 520px);
      margin: clamp(22px, 6vh, 48px) auto 0;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: var(--white);
      font-size: 0.85rem;
      line-height: 1.45;
    }

    .contact p {
      max-width: 100%;
      margin: 0;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .contact a {
      color: inherit;
    }

    .contact .email-link {
      display: inline-block;
      max-width: 100%;
      color: var(--white);
      font-weight: 600;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .email-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 12px 32px;
      border: 2px solid var(--pink);
      border-radius: 50px;
      background: transparent;
      color: var(--white);
      font-family: "Raleway", sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.5s;
    }

    .email-button:hover,
    .email-button:focus {
      background: var(--pink);
      color: var(--white);
      box-shadow: 0 0 22px rgba(234, 0, 255, 0.48);
      outline: none;
    }

    @media (max-width: 640px) {
      .page {
        padding: 118px 22px 34px;
      }

      .brand-logo {
        width: 62px;
      }

      .coming-soon {
        max-width: 300px;
        line-height: 1.02;
      }

      .event-name {
        font-size: clamp(2rem, 9.2vw, 2.45rem);
      }

      .event-year {
        font-size: clamp(1.8rem, 8vw, 2.1rem);
      }

      .soon {
        font-size: clamp(0.95rem, 4vw, 1.05rem);
      }

      .contact {
        gap: 16px;
        font-size: 0.75rem;
      }

      .email-button {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="brand-logo" aria-hidden="true"></div>

  <main class="page">
    <h1 class="coming-soon">
      <span class="event-name">Roosad Käärid</span>
      <span class="event-year">2027</span>
      <span class="soon">coming soon</span>
    </h1>

    <section class="contact" aria-label="Koostöö kontakt">
      <p>Koostöösoovide korral kirjutage meile:<br><a class="email-link" href="mailto:roosadkaarid@gmail.com">roosadkaarid@gmail.com</a></p>
      <a class="email-button" href="mailto:roosadkaarid@gmail.com">Kirjuta meile</a>
    </section>
  </main>
</body>
</html>
