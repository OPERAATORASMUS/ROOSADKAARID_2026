<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roosad Käärid 2027</title>
  <meta name="keywords" content="Fashion, Roosa, moekonkurss, Käärid, Eesti, Mood, Show, Disainer, Trend, Kool, Rocca al Mare, Fotograafia, Models, Modellid, Collections, Kollektsioonid, Noored">
  <meta name="description" content="Roosad Käärid 2027 coming soon. Koostöösoovide korral kirjuta meile.">
  <link rel="icon" href="veits pixeldatud.jpg">
  <link href="./Roosad käärid 2025_files/css" rel="stylesheet">
  <style>
    :root {
      --pink: #ea00ff;
      --black: #000000;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--black);
      color: var(--pink);
      font-family: "Open Sans", Arial, sans-serif;
      overflow-x: hidden;
    }

    .video-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(12, 0, 14, 0.62);
      pointer-events: none;
    }

    .brand-logo {
      position: fixed;
      z-index: 2;
      top: clamp(20px, 4vw, 44px);
      left: clamp(18px, 4vw, 46px);
      width: clamp(70px, 9vw, 120px);
      aspect-ratio: 1;
      background: transparent url("roosad-logo-transparent.png") center / contain no-repeat;
      pointer-events: none;
    }

    .glitch-intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.94);
      pointer-events: none;
      animation: glitch-intro-exit 450ms ease-out forwards;
    }

    .glitch-intro span {
      font-family: "Raleway", Arial, sans-serif;
      font-size: 160px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      color: var(--pink);
      text-shadow: -5px 0 #ffffff, 5px 0 #00e5cc;
      animation: glitch-intro-shift 450ms steps(1, end) forwards;
    }

    @keyframes glitch-intro-shift {
      0%, 45% { transform: translateX(-4px) skewX(-5deg); }
      20%, 65% { transform: translateX(4px) skewX(5deg); }
      85%, 100% { transform: none; }
    }

    @keyframes glitch-intro-exit {
      0%, 75% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }

    @media (max-width: 1000px) {
      .glitch-intro span { font-size: 100px; }
    }

    @media (max-width: 640px) {
      .glitch-intro span { font-size: 64px; }
    }

    @media (max-width: 320px) {
      .glitch-intro span { font-size: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .glitch-intro { display: none; }
    }

    .page {
      position: relative;
      z-index: 2;
      display: grid;
      width: 100%;
      min-height: 100vh;
      padding: clamp(32px, 7vw, 72px);
      grid-template-rows: 1fr auto;
      align-items: center;
      overflow-x: hidden;
      text-align: center;
    }

    .coming-soon {
      margin: 0 auto;
      max-width: 1060px;
      font-family: "Raleway", sans-serif;
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: 0;
    }

    .coming-soon span {
      display: block;
    }

    .coming-soon .glitch-char {
      position: relative;
      display: inline-block;
      white-space: pre;
    }

    .glitch-char.is-scrambling {
      color: transparent;
      text-shadow: none;
    }

    .glitch-char.is-scrambling::after {
      content: attr(data-glyph);
      position: absolute;
      inset: 0;
      color: var(--pink);
      text-align: center;
      text-shadow: -2px 0 #ffffff, 2px 0 #00e5cc;
    }

    .soon .glitch-char.is-scrambling::after {
      color: var(--white);
    }

    .event-name {
      color: var(--pink);
      font-size: clamp(3.2rem, 6.8vw, 6.6rem);
      text-shadow: 0 0 18px rgba(234, 0, 255, 0.72);
    }

    .event-year {
      color: var(--pink);
      font-size: clamp(2.7rem, 5.5vw, 5.4rem);
      text-shadow: 0 0 16px rgba(234, 0, 255, 0.64);
    }

    .soon {
      margin-top: clamp(10px, 2vw, 20px);
      color: var(--white);
      font-family: "Open Sans", Arial, sans-serif;
      font-size: clamp(1rem, 2vw, 1.85rem);
      font-style: italic;
      font-weight: 700;
      text-shadow: none;
    }

    .contact {
      display: flex;
      width: min(100%, 520px);
      margin: clamp(22px, 6vh, 48px) auto 0;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: var(--white);
      font-size: 0.85rem;
      line-height: 1.45;
    }

    .contact p {
      max-width: 100%;
      margin: 0;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .contact a {
      color: inherit;
    }

    .contact .email-link {
      display: inline-block;
      max-width: 100%;
      color: var(--white);
      font-weight: 600;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .email-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 12px 32px;
      border: 2px solid var(--pink);
      border-radius: 50px;
      background: transparent;
      color: var(--white);
      font-family: "Raleway", sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.5s;
    }

    .email-button:hover,
    .email-button:focus {
      background: var(--pink);
      color: var(--white);
      box-shadow: 0 0 22px rgba(234, 0, 255, 0.48);
      outline: none;
    }

    @media (max-width: 640px) {
      .page {
        padding: 118px 22px 34px;
      }

      .brand-logo {
        width: 62px;
      }

      .coming-soon {
        max-width: 300px;
        line-height: 1.02;
      }

      .event-name {
        font-size: clamp(2rem, 9.2vw, 2.45rem);
      }

      .event-year {
        font-size: clamp(1.8rem, 8vw, 2.1rem);
      }

      .soon {
        font-size: clamp(0.95rem, 4vw, 1.05rem);
      }

      .contact {
        gap: 16px;
        font-size: 0.75rem;
      }

      .email-button {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="glitch-intro" aria-hidden="true"><span>GLITCH</span></div>
  <video class="video-background" autoplay muted loop playsinline aria-hidden="true">
    <source src="tasustavideo.mp4" type="video/mp4">
  </video>

  <div class="brand-logo" aria-hidden="true"></div>

  <main class="page">
    <h1 class="coming-soon">
      <span class="event-name">Roosad Käärid</span>
      <span class="event-year">2027</span>
      <span class="soon">coming soon</span>
    </h1>

    <section class="contact" aria-label="Koostöö kontakt">
      <p>Koostöösoovide korral kirjutage meile:<br><a class="email-link" href="mailto:roosadkaarid@gmail.com">roosadkaarid@gmail.com</a></p>
      <a class="email-button" href="mailto:roosadkaarid@gmail.com">Kirjuta meile</a>
    </section>
  </main>
  <script>
    const backgroundVideo = document.querySelector(".video-background");

    function loopBeforeCredits() {
      if (
        !backgroundVideo.paused &&
        !backgroundVideo.seeking &&
        Number.isFinite(backgroundVideo.duration) &&
        backgroundVideo.duration > 2 &&
        backgroundVideo.currentTime >= backgroundVideo.duration - 2
      ) {
        backgroundVideo.currentTime = 0;
      }

      requestAnimationFrame(loopBeforeCredits);
    }

    requestAnimationFrame(loopBeforeCredits);
  </script>
  <script>
    const heading = document.querySelector(".coming-soon");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*+/<>";
    const rows = Array.from(heading.children);
    let glitchTimer;
    let glitchInterval;

    heading.setAttribute("aria-label", rows.map(row => row.textContent).join(" "));

    rows.forEach(row => {
      row.setAttribute("aria-hidden", "true");
      const characters = Array.from(row.textContent, character => {
        const span = document.createElement("span");
        span.className = "glitch-char";
        span.textContent = character;
        return span;
      });
      row.replaceChildren(...characters);
    });

    function resetGlitch() {
      clearTimeout(glitchTimer);
      clearInterval(glitchInterval);
      heading.querySelectorAll(".is-scrambling").forEach(character => {
        character.classList.remove("is-scrambling");
        delete character.dataset.glyph;
      });
    }

    function scheduleGlitch() {
      resetGlitch();
      if (reducedMotion.matches || document.hidden) return;

      glitchTimer = setTimeout(() => {
        const characters = rows.flatMap(row => Array.from(row.children));
        const started = performance.now();

        function scramble() {
          const progress = (performance.now() - started) / 850;
          characters.forEach((character, index) => {
            const scrambled = character.textContent.trim() !== "" &&
              progress < 0.3 + (index / characters.length) * 0.7;
            character.classList.toggle("is-scrambling", scrambled);
            if (scrambled) {
              character.dataset.glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
            }
          });
          if (progress >= 1) scheduleGlitch();
        }

        glitchInterval = setInterval(scramble, 65);
        scramble();
      }, 2000 + Math.random() * 3000);
    }

    reducedMotion.addEventListener("change", scheduleGlitch);
    document.addEventListener("visibilitychange", scheduleGlitch);
    scheduleGlitch();
  </script>
</body>
</html>
